services:
  db:
    image: postgres:17-alpine
    container_name: ${PROJECT_NAME?PROJECT_NAME must be set}-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - default
      - proxy-public

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ${PROJECT_NAME?PROJECT_NAME must be set}-pgadmin
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL?PGADMIN_DEFAULT_EMAIL must be set}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD?PGADMIN_DEFAULT_PASSWORD must be set}
    depends_on:
      - db
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK?TRAEFIK_NETWORK must be set}"
      - "traefik.http.routers.${PROJECT_NAME}-pgadmin.rule=Host(`${DOMAIN_NAME?DOMAIN_NAME must be set}`)"
      - "traefik.http.routers.${PROJECT_NAME}-pgadmin.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.${PROJECT_NAME}-pgadmin.tls=true"
      - "traefik.http.services.${PROJECT_NAME}-pgadmin.loadbalancer.server.port=80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - default
      - proxy-public

volumes:
  postgres_data:
  pgadmin_data:

networks:
  proxy-public:
    external: true
    name: ${TRAEFIK_NETWORK?TRAEFIK_NETWORK must be set}
